<svg xmlns="http://www.w3.org/2000/svg" width="960" height="444" viewBox="0 0 960 444" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8984"/></marker></defs><rect x="0.5" y="0.5" width="959" height="443" rx="12" fill="#fcfcfb" stroke="#e4e3df"/><text x="24" y="34" font-size="17" fill="#0b0b0b" font-weight="600" text-anchor="start">一个控制周期里数据怎么流动</text><text x="24" y="54" font-size="12.5" fill="#52514e" text-anchor="start">中断只收数据；解析、解算、控制都在任务里。数据由产生方保存并带写入时刻，xxx_read() 超时就返回 false。</text><text x="24" y="84" font-size="12" fill="#52514e" font-weight="600" text-anchor="start">硬件输入</text><rect x="24" y="92" width="150" height="48" rx="8" fill="#ffffff" stroke="#e4e3df" stroke-width="1"/><text x="36" y="112" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">CAN1 / CAN2</text><text x="36" y="130" font-size="12" fill="#52514e" text-anchor="start">电机反馈</text><rect x="24" y="150" width="150" height="48" rx="8" fill="#ffffff" stroke="#e4e3df" stroke-width="1"/><text x="36" y="170" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">UART5 / USART10</text><text x="36" y="188" font-size="12" fill="#52514e" text-anchor="start">DR16 · 图传</text><rect x="24" y="208" width="150" height="48" rx="8" fill="#ffffff" stroke="#e4e3df" stroke-width="1"/><text x="36" y="228" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">USB</text><text x="36" y="246" font-size="12" fill="#52514e" text-anchor="start">视觉上位机</text><rect x="24" y="266" width="150" height="48" rx="8" fill="#ffffff" stroke="#e4e3df" stroke-width="1"/><text x="36" y="286" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">SPI2</text><text x="36" y="304" font-size="12" fill="#52514e" text-anchor="start">BMI088 IMU</text><rect x="200" y="92" width="124" height="164" rx="8" fill="#fcf1f1" stroke="#ecb1b1" stroke-width="1"/><text x="262.0" y="122" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="middle">中断</text><text x="262.0" y="148" font-size="12" fill="#52514e" text-anchor="middle">只收数据</text><text x="262.0" y="168" font-size="12" fill="#52514e" text-anchor="middle">唤醒 comm_rx</text><text x="262.0" y="188" font-size="12" fill="#52514e" text-anchor="middle">不做解析</text><line x1="174" y1="116.0" x2="198" y2="116.0" stroke="#8a8984" stroke-width="1.5" marker-end="url(#ah)"/><line x1="174" y1="174.0" x2="198" y2="174.0" stroke="#8a8984" stroke-width="1.5" marker-end="url(#ah)"/><line x1="174" y1="232.0" x2="198" y2="232.0" stroke="#8a8984" stroke-width="1.5" marker-end="url(#ah)"/><text x="350" y="84" font-size="12" fill="#52514e" font-weight="600" text-anchor="start">接收与解算任务</text><rect x="350" y="92" width="186" height="164" rx="8" fill="#eef4fc" stroke="#aac9ef" stroke-width="1"/><rect x="350" y="92" width="6" height="164" rx="3" fill="#2a78d6" stroke="#2a78d6" stroke-width="1"/><text x="368" y="118" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="start">comm_rx_task</text><text x="480.15999999999997" y="118" font-size="12" fill="#52514e" text-anchor="start">优先级 5</text><text x="368" y="144" font-size="12" fill="#52514e" text-anchor="start">有数据才运行</text><text x="368" y="166" font-size="12" fill="#52514e" text-anchor="start">交给对应设备解析</text><text x="368" y="188" font-size="12" fill="#52514e" text-anchor="start">校验通过才算在线</text><text x="368" y="210" font-size="12" fill="#52514e" text-anchor="start">发布遥控、电机反馈</text><line x1="324" y1="174.0" x2="348" y2="174.0" stroke="#8a8984" stroke-width="1.5" marker-end="url(#ah)"/><rect x="350" y="262" width="186" height="96" rx="8" fill="#eef4fc" stroke="#aac9ef" stroke-width="1"/><rect x="350" y="262" width="6" height="96" rx="3" fill="#2a78d6" stroke="#2a78d6" stroke-width="1"/><text x="368" y="286" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="start">ins_task</text><text x="445.44" y="286" font-size="12" fill="#52514e" text-anchor="start">优先级 6</text><text x="368" y="310" font-size="12" fill="#52514e" text-anchor="start">零偏标定 / 在线修正</text><text x="368" y="332" font-size="12" fill="#52514e" text-anchor="start">四元数 EKF · 恒温加热</text><line x1="174" y1="290.0" x2="348" y2="290.0" stroke="#8a8984" stroke-width="1.5" marker-end="url(#ah)"/><text x="562" y="84" font-size="12" fill="#52514e" font-weight="600" text-anchor="start">最新数据 + 时刻</text><rect x="562" y="98" width="122" height="48" rx="10" fill="#fdf6e6" stroke="#f5cb73" stroke-width="1"/><text x="623.0" y="117" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">dr16_read</text><text x="623.0" y="135" font-size="11.5" fill="#52514e" text-anchor="middle">遥控，200 ms 过期</text><rect x="562" y="156" width="122" height="48" rx="10" fill="#fdf6e6" stroke="#f5cb73" stroke-width="1"/><text x="623.0" y="175" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">motor_read…</text><text x="623.0" y="193" font-size="11.5" fill="#52514e" text-anchor="middle">电机反馈，20 ms</text><rect x="562" y="284" width="122" height="48" rx="10" fill="#fdf6e6" stroke="#f5cb73" stroke-width="1"/><text x="623.0" y="303" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">ins_read</text><text x="623.0" y="321" font-size="11.5" fill="#52514e" text-anchor="middle">姿态，20 ms</text><line x1="536" y1="122" x2="560" y2="122" stroke="#8a8984" stroke-width="1.5" marker-end="url(#ah)"/><line x1="536" y1="180" x2="560" y2="180" stroke="#8a8984" stroke-width="1.5" marker-end="url(#ah)"/><line x1="536" y1="308" x2="560" y2="308" stroke="#8a8984" stroke-width="1.5" marker-end="url(#ah)"/><text x="712" y="84" font-size="12" fill="#52514e" font-weight="600" text-anchor="start">control_task · 1 kHz · 优先级 4</text><rect x="712" y="92" width="224" height="44" rx="8" fill="#eef4fc" stroke="#9fc2ed" stroke-width="1"/><rect x="712" y="92" width="5" height="44" rx="2" fill="#2a78d6" stroke="#2a78d6" stroke-width="1"/><text x="728" y="111" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">① 读输入</text><text x="728" y="128" font-size="11.5" fill="#52514e" text-anchor="start">过期的当作没有</text><line x1="742" y1="136" x2="742" y2="143" stroke="#8a8984" stroke-width="1.2" marker-end="url(#ah)"/><rect x="712" y="144" width="224" height="44" rx="8" fill="#fdf3ef" stroke="#f6bba4" stroke-width="1"/><rect x="712" y="144" width="5" height="44" rx="2" fill="#eb6834" stroke="#eb6834" stroke-width="1"/><text x="728" y="163" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">② 安全门</text><text x="728" y="180" font-size="11.5" fill="#52514e" text-anchor="start">判断能不能动</text><line x1="742" y1="188" x2="742" y2="195" stroke="#8a8984" stroke-width="1.2" marker-end="url(#ah)"/><rect x="712" y="196" width="224" height="44" rx="8" fill="#eef4fc" stroke="#9fc2ed" stroke-width="1"/><rect x="712" y="196" width="5" height="44" rx="2" fill="#2a78d6" stroke="#2a78d6" stroke-width="1"/><text x="728" y="215" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">③ 子系统计算</text><text x="728" y="232" font-size="11.5" fill="#52514e" text-anchor="start">PID 等</text><line x1="742" y1="240" x2="742" y2="247" stroke="#8a8984" stroke-width="1.2" marker-end="url(#ah)"/><rect x="712" y="248" width="224" height="44" rx="8" fill="#fdf3ef" stroke="#f6bba4" stroke-width="1"/><rect x="712" y="248" width="5" height="44" rx="2" fill="#eb6834" stroke="#eb6834" stroke-width="1"/><text x="728" y="267" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">④ 全车停改写</text><text x="728" y="284" font-size="11.5" fill="#52514e" text-anchor="start">换成各电机的停机动作</text><line x1="742" y1="292" x2="742" y2="299" stroke="#8a8984" stroke-width="1.2" marker-end="url(#ah)"/><rect x="712" y="300" width="224" height="44" rx="8" fill="#eef4fc" stroke="#9fc2ed" stroke-width="1"/><rect x="712" y="300" width="5" height="44" rx="2" fill="#2a78d6" stroke="#2a78d6" stroke-width="1"/><text x="728" y="319" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">⑤ 电机组打包</text><text x="728" y="336" font-size="11.5" fill="#52514e" text-anchor="start">经 CAN 发给电机</text><path d="M 684 122 L 698 122 L 698 114" fill="none" stroke="#8a8984" stroke-width="1.5"/><path d="M 684 180 L 698 180 L 698 114" fill="none" stroke="#8a8984" stroke-width="1.5"/><path d="M 684 308 L 698 308 L 698 114" fill="none" stroke="#8a8984" stroke-width="1.5"/><line x1="698" y1="114" x2="710" y2="114" stroke="#8a8984" stroke-width="1.5" marker-end="url(#ah)"/><text x="24" y="360" font-size="12" fill="#52514e" font-weight="600" text-anchor="start">低优先级任务：只读数据，不参与控制</text><rect x="24" y="368" width="290" height="58" rx="8" fill="#f2f1f9" stroke="#c0bae0" stroke-width="1"/><rect x="24" y="368" width="5" height="58" rx="2" fill="#4a3aa7" stroke="#4a3aa7" stroke-width="1"/><text x="40" y="392" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="start">detect_task</text><text x="143.48" y="392" font-size="12" fill="#52514e" text-anchor="start">100 Hz · 优先级 3</text><text x="40" y="412" font-size="12" fill="#52514e" text-anchor="start">报告设备上线 / 离线</text><rect x="330" y="368" width="290" height="58" rx="8" fill="#f2f1f9" stroke="#c0bae0" stroke-width="1"/><rect x="330" y="368" width="5" height="58" rx="2" fill="#4a3aa7" stroke="#4a3aa7" stroke-width="1"/><text x="346" y="392" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="start">indicator_task</text><text x="475.52" y="392" font-size="12" fill="#52514e" text-anchor="start">40 Hz · 优先级 2</text><text x="346" y="412" font-size="12" fill="#52514e" text-anchor="start">状态灯 · 蜂鸣器 · 低电量</text><rect x="636" y="368" width="290" height="58" rx="8" fill="#f2f1f9" stroke="#c0bae0" stroke-width="1"/><rect x="636" y="368" width="5" height="58" rx="2" fill="#4a3aa7" stroke="#4a3aa7" stroke-width="1"/><text x="652" y="392" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="start">log_task</text><text x="729.44" y="392" font-size="12" fill="#52514e" text-anchor="start">1 Hz · 优先级 1</text><text x="652" y="412" font-size="12" fill="#52514e" text-anchor="start">每秒打印这台车状态</text><path d="M 623.0 332 L 623.0 397 L 562 397" fill="none" stroke="#8a8984" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ah)"/></svg>
