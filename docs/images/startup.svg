<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8984"/></marker></defs><rect x="0.5" y="0.5" width="959" height="329" rx="12" fill="#fcfcfb" stroke="#e4e3df"/><text x="24" y="34" font-size="17" fill="#0b0b0b" font-weight="600" text-anchor="start">上电后按什么顺序启动</text><text x="24" y="54" font-size="12.5" fill="#52514e" text-anchor="start">前两行在 01_applic/system/app_main.c，通用。任何一步失败都停在 halt_on_init_failure()。⑥ 之前安全门一直是 Init，不能解锁。</text><rect x="24" y="74" width="912" height="70" rx="8" fill="#f2f7fd" stroke="#bfd6f3" stroke-width="1"/><rect x="24" y="74" width="6" height="70" rx="3" fill="#2a78d6" stroke="#2a78d6" stroke-width="1"/><text x="42" y="104" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="start">app_main</text><text x="42" y="124" font-size="11.5" fill="#52514e" text-anchor="start">调度器启动前，单线程</text><rect x="196.0" y="85" width="128.0" height="48" rx="8" fill="#ffffff" stroke="#94bcea" stroke-width="1"/><text x="208.0" y="106" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">① 时钟</text><text x="208.0" y="124" font-size="11.5" fill="#52514e" text-anchor="start">DWT 计数器自检</text><line x1="326.0" y1="109.0" x2="344.0" y2="109.0" stroke="#8a8984" stroke-width="1.5" marker-end="url(#ah)"/><rect x="346.0" y="85" width="128.0" height="48" rx="8" fill="#ffffff" stroke="#94bcea" stroke-width="1"/><text x="358.0" y="106" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">② 日志</text><text x="358.0" y="124" font-size="11.5" fill="#52514e" text-anchor="start">RTT 初始化</text><line x1="476.0" y1="109.0" x2="494.0" y2="109.0" stroke="#8a8984" stroke-width="1.5" marker-end="url(#ah)"/><rect x="496.0" y="85" width="128.0" height="48" rx="8" fill="#ffffff" stroke="#94bcea" stroke-width="1"/><text x="508.0" y="106" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">③ 初始化对象</text><text x="508.0" y="124" font-size="11.5" fill="#52514e" text-anchor="start">组装设备和机构</text><line x1="626.0" y1="109.0" x2="644.0" y2="109.0" stroke="#8a8984" stroke-width="1.5" marker-end="url(#ah)"/><rect x="646.0" y="85" width="128.0" height="48" rx="8" fill="#ffffff" stroke="#94bcea" stroke-width="1"/><text x="658.0" y="106" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">④ 创建任务</text><text x="658.0" y="124" font-size="11.5" fill="#52514e" text-anchor="start">按任务表静态创建</text><line x1="776.0" y1="109.0" x2="794.0" y2="109.0" stroke="#8a8984" stroke-width="1.5" marker-end="url(#ah)"/><rect x="796.0" y="85" width="128.0" height="48" rx="8" fill="#ffffff" stroke="#94bcea" stroke-width="1"/><text x="808.0" y="106" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">⑤ 启动调度器</text><text x="808.0" y="124" font-size="11.5" fill="#52514e" text-anchor="start">交给 FreeRTOS</text><line x1="84" y1="145" x2="84" y2="161" stroke="#8a8984" stroke-width="1.5" marker-end="url(#ah)"/><rect x="24" y="162" width="912" height="70" rx="8" fill="#f1faf7" stroke="#bbe7d7" stroke-width="1"/><rect x="24" y="162" width="6" height="70" rx="3" fill="#1baf7a" stroke="#1baf7a" stroke-width="1"/><text x="42" y="192" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="start">startup_task</text><text x="42" y="212" font-size="11.5" fill="#52514e" text-anchor="start">调度器启动后运行一次</text><rect x="196.0" y="173" width="353.0" height="48" rx="8" fill="#ffffff" stroke="#8dd7bc" stroke-width="1"/><text x="208.0" y="194" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">⑥ 系统就绪</text><text x="208.0" y="212" font-size="11.5" fill="#52514e" text-anchor="start">允许解锁</text><line x1="551.0" y1="197.0" x2="569.0" y2="197.0" stroke="#8a8984" stroke-width="1.5" marker-end="url(#ah)"/><rect x="571.0" y="173" width="353.0" height="48" rx="8" fill="#ffffff" stroke="#8dd7bc" stroke-width="1"/><text x="583.0" y="194" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">⑦ 删除自己</text><text x="583.0" y="212" font-size="11.5" fill="#52514e" text-anchor="start">“startup done”</text><line x1="84" y1="233" x2="84" y2="249" stroke="#8a8984" stroke-width="1.5" marker-end="url(#ah)"/><rect x="24" y="250" width="912" height="70" rx="8" fill="#f4f3fa" stroke="#c9c4e5" stroke-width="1"/><rect x="24" y="250" width="6" height="70" rx="3" fill="#4a3aa7" stroke="#4a3aa7" stroke-width="1"/><text x="42" y="280" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="start">周期任务</text><text x="42" y="300" font-size="11.5" fill="#52514e" text-anchor="start">各自按周期运行</text><rect x="196.0" y="261" width="165.5" height="48" rx="8" fill="#ffffff" stroke="#a49cd3" stroke-width="1"/><text x="208.0" y="282" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">ins_task</text><text x="208.0" y="300" font-size="11.5" fill="#52514e" text-anchor="start">上电静止标定约 2 s</text><line x1="363.5" y1="285.0" x2="381.5" y2="285.0" stroke="#8a8984" stroke-width="1.5" marker-end="url(#ah)"/><rect x="383.5" y="261" width="165.5" height="48" rx="8" fill="#ffffff" stroke="#a49cd3" stroke-width="1"/><text x="395.5" y="282" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">comm_rx_task</text><text x="395.5" y="300" font-size="11.5" fill="#52514e" text-anchor="start">先打开 CAN / 串口</text><line x1="551.0" y1="285.0" x2="569.0" y2="285.0" stroke="#8a8984" stroke-width="1.5" marker-end="url(#ah)"/><rect x="571.0" y="261" width="165.5" height="48" rx="8" fill="#ffffff" stroke="#a49cd3" stroke-width="1"/><text x="583.0" y="282" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">control_task</text><text x="583.0" y="300" font-size="11.5" fill="#52514e" text-anchor="start">1 kHz 控制</text><line x1="738.5" y1="285.0" x2="756.5" y2="285.0" stroke="#8a8984" stroke-width="1.5" marker-end="url(#ah)"/><rect x="758.5" y="261" width="165.5" height="48" rx="8" fill="#ffffff" stroke="#a49cd3" stroke-width="1"/><text x="770.5" y="282" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">indicator_task 等</text><text x="770.5" y="300" font-size="11.5" fill="#52514e" text-anchor="start">先打开 ADC、蜂鸣器</text></svg>
