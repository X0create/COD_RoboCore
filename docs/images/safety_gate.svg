<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8984"/></marker></defs><rect x="0.5" y="0.5" width="959" height="309" rx="12" fill="#fcfcfb" stroke="#e4e3df"/><text x="24" y="34" font-size="17" fill="#0b0b0b" font-weight="600" text-anchor="start">安全门：什么时候能动</text><text x="24" y="54" font-size="12.5" fill="#52514e" text-anchor="start">安全门只管“全车停”。某个机构自己的设备离线，由那个子系统自己停下（机构停）。</text><rect x="40" y="124" width="230" height="92" rx="12" fill="#f6f6f5" stroke="#c4c4c2" stroke-width="1.5"/><rect x="40" y="124" width="6" height="92" rx="3" fill="#8a8984" stroke="#8a8984" stroke-width="1"/><text x="60" y="152" font-size="16" fill="#0b0b0b" font-weight="600" text-anchor="start">Init</text><text x="109.68" y="152" font-size="13" fill="#52514e" font-weight="600" text-anchor="start">启动中</text><text x="60" y="178" font-size="12" fill="#52514e" text-anchor="start">不能解锁</text><text x="60" y="198" font-size="12" fill="#52514e" text-anchor="start">等启动流程完成</text><rect x="340" y="124" width="230" height="92" rx="12" fill="#fbefef" stroke="#e89d9d" stroke-width="1.5"/><rect x="340" y="124" width="6" height="92" rx="3" fill="#d03b3b" stroke="#d03b3b" stroke-width="1"/><text x="360" y="152" font-size="16" fill="#0b0b0b" font-weight="600" text-anchor="start">Safe</text><text x="409.68" y="152" font-size="13" fill="#52514e" font-weight="600" text-anchor="start">全车停</text><text x="360" y="178" font-size="12" fill="#52514e" text-anchor="start">每个电机执行自己的停机动作</text><text x="360" y="198" font-size="12" fill="#52514e" text-anchor="start">DJI 零力矩或失能，达妙阻尼</text><rect x="686" y="124" width="234" height="92" rx="12" fill="#ecf8ec" stroke="#86d186" stroke-width="1.5"/><rect x="686" y="124" width="6" height="92" rx="3" fill="#0ca30c" stroke="#0ca30c" stroke-width="1"/><text x="706" y="152" font-size="16" fill="#0b0b0b" font-weight="600" text-anchor="start">Manual</text><text x="775.52" y="152" font-size="13" fill="#52514e" font-weight="600" text-anchor="start">允许动作</text><text x="706" y="178" font-size="12" fill="#52514e" text-anchor="start">解锁后 300 ms 内</text><text x="706" y="198" font-size="12" fill="#52514e" text-anchor="start">输出从 0 慢慢升上来</text><line x1="270" y1="170.0" x2="338" y2="170.0" stroke="#8a8984" stroke-width="1.5" marker-end="url(#ah)"/><text x="304" y="162.0" font-size="12" fill="#52514e" text-anchor="middle">启动完成</text><path d="M 455 122 C 455 84, 803 84, 803 122" fill="none" stroke="#8a8984" stroke-width="1.5" marker-end="url(#ah)"/><rect x="474" y="72" width="312" height="26" rx="4" fill="#fcfcfb" stroke="#fcfcfb" stroke-width="1"/><text x="630" y="90" font-size="12" fill="#0b0b0b" text-anchor="middle">解锁：遥控在线 + IMU 就绪，拨杆“下”→“中 / 上”</text><path d="M 803 218 C 803 262, 455 262, 455 218" fill="none" stroke="#8a8984" stroke-width="1.5" marker-end="url(#ah)"/><rect x="462" y="238" width="336" height="26" rx="4" fill="#fcfcfb" stroke="#fcfcfb" stroke-width="1"/><text x="630" y="256" font-size="12" fill="#0b0b0b" text-anchor="middle">急停（拨杆到“下”）· 遥控丢失 &gt; 200 ms · IMU 未就绪</text><text x="24" y="292" font-size="12" fill="#52514e" text-anchor="start">回到 Safe 后必须重新拨杆才能解锁：遥控恢复、上电时拨杆已在上方，都不会自己动起来。</text></svg>
